---
name: "Release Automation"

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
  contents: write

jobs:
  tagged-release:
    name: "Tagged Release"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: "ubuntu-latest"

    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: elgohr/Github-Release-Action@c5ea99036abb741a89f8bf1f2cd7fba845e3313a # v5
        with:
          title: "Release ${{ github.ref_name }}"
          tag: ${{ github.ref_name }}
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  latest-release:
    name: "Dev Release"
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    concurrency:
      group: dev-release
      cancel-in-progress: false

    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Create or update dev release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_id=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == "dev") | .id')

          git tag --force dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev

          notes_file="$RUNNER_TEMP/dev-release-notes.md"
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name=dev -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$notes_file"

          if [ -n "$release_id" ]; then
            gh release edit dev --title "Dev release" --prerelease \
              --draft=false --notes-file "$notes_file"
          else
            gh release create dev --title "Dev release" --prerelease \
              --verify-tag --notes-file "$notes_file"
          fi
