[package]
name = "splunk"
version = "0.2.0"
edition = "2021"
description = "Splunk client implementation supporting HEC and REST APIs"
license = "MIT"
documentation = "https://yaleman.github.io/splunk-rs/splunk/"
repository = "https://github.com/yaleman/splunk-rs"
homepage = "https://github.com/yaleman/splunk-rs"

[features]
cli = ["clap"]
test_ci = []   # Used when in CI mode, to skip tests

[[bin]]
name = "splunk_file_to_hec"
path = "src/bin/file_to_hec.rs"
required-features = ["cli"]

[[bin]]
name = "splunk_pipe_to_hec"
path = "src/bin/pipe_to_hec.rs"
required-features = ["cli"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
futures-util = "0.3.31"
log = "0.4.34"
reqwest = { version = "^0.13.5", features = [
    "json",
    "stream",
    "cookies",
    "gzip",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
tokio-util = { version = "0.7.19", features = ["io-util", "futures-io"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"

[dev-dependencies]
httpmock = "0.8.3"
